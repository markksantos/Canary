name: Canary
options:
  bundleIdPrefix: com.canary
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  CanaryPackage:
    path: CanaryPackage

targets:
  Canary:
    type: application
    platform: macOS
    sources:
      - path: Canary
        excludes:
          - Info.plist
          - Canary.entitlements
    dependencies:
      - package: CanaryPackage
        product: CanaryEngine
      - package: CanaryPackage
        product: CanaryUI
    settings:
      base:
        INFOPLIST_FILE: Canary/Info.plist
        CODE_SIGN_ENTITLEMENTS: Canary/Canary.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.canary.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
        CODE_SIGNING_ALLOWED: true
    scheme:
      testTargets: []
      gatherCoverageData: false
